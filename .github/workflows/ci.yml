name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.9", "3.12"] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest discover -s tests -v
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: python3 src/eval_set_gate.py verify --evals "examples/evals/**" --lockfile examples/evals.lock.json
      - name: Run action against itself (no prompt changes -> pass)
        uses: ./
        with:
          base: HEAD~1
          watch: "examples/prompts/**"
          evals: "examples/evals/**"
          lockfile: "examples/evals.lock.json"
